ment":{"level":"partial","scope":["file"]}},{"kind":"cost","id":"01M4X49J4WDN51TBSKPS6SHV5M","seq":1726,"source":"estimated","purpose":"inference","tokens":{"input":643,"output":65,"cacheRead":97024,"cacheWrite":0,"reasoning":0},"billing":{"usdMicros":0,"source":"estimated","subscription":false},"model":"agnes-3.0-flash","timing":{"ttftMs":4309,"durationMs":4311},"credits":0},{"kind":"context-sections","id":"01M4X49JMS6YE5NJV2KHRJZV36","seq":1736,"sections":[{"id":"core:untrusted-envelope","order":0,"source":"core","tokens":380},{"id":"persona","order":100,"source":"@agnes/code","tokens":266},{"id":"environment","order":110,"source":"@agnes/code","tokens":278},{"id":"coding-doctrine","order":130,"source":"@agnes/code","tokens":126}]},{"kind":"assistant","id":"01M4X49WMYSPHBCBCSD3PHY4C3","seq":1741,"text":"","streaming":false},{"kind":"tool","id":"01M4X49WMZRF456D6Q4DBT9BN4","seq":1742,"toolUseId":"t21-0b40ef38be2e2013708d415029310e3d","name":"read","status":"completed","summary":"read","argsPreview":"{\"path\":\"C:\\\\Users\\\\oyfsh\\\\Downloads\\\\沙尘救援3\\\\README.md\"}","resultPreview":"1\t# 沙尘智眼：3D 救援指挥台（独立升级包）\n2\t\n3\t此包不覆盖原工程。包含网页、Node.js 虚拟环境服务和启动脚本；无需 npm install。3D 引擎首次加载需要联网访问 jsDelivr 或 unpkg。没有真实 AGH 接入前，只展示环境和人工事件。\n4\t\n5\t## 启动\n6\t\n7\t安装 Node.js 后双击 start.cmd，保持终端开启。打开 http://127.0.0.1:8787 。不要直接双击 index.html：设备 API 需要服务。\n8\t\n9\t如果浏览器先于服务打开，请刷新。端口被占用时先关闭旧终端，再启动。服务只监听本机 127.0.0.1；C 的 AGH 最好运行在同一台电脑。\n10\t\n11\t## 人工验收（先关闭自动天气）\n12\t\n13\t1. 设置沙尘等级 2，点击尝试自救：5 秒后收到环境反馈，自救失败。\n14\t2. 点击侦察路线：约 15 秒后获得备用路线，无人机返航。\n15\t3. 点击派遣救援：救援车到达后牵引车辆，最终显示成功，统计来自服务。\n16\t4. 重置，设置沙尘等级 6，再点击侦察：工具应拒绝，不能无条件起飞。\n17\t5. 降回等级 2，重新侦察并派遣救援，检查恢复链路。\n18\t6. 开启自动天气，读数、雾和粒子变化；天气不会自行生成 AGH 决策。\n19\t\n20\t## C 的接入协议\n21\t\n22\t本包提供 HTTP 适配接口，不声称已实现 AGH Harness/MHS 原生协议。C 应用实际 Harness 的工具注册方法包装这些接口。\n23\t\n24\t- GET /api/observations：气象站、车辆、无人机、救援车和已观测路线。\n25\t- GET /api/tools：工具名称、仿真约束和单位。\n26\t- POST /api/tool：调用设备工具，例如 {\"name\":\"dispatch_drone\"}。\n27\t- POST /api/agent-event：传递实际 AGH 决策，例如 {\"message\":\"根据气象站风速和能见度，当前允许无人机侦察。\",\"action\":\"dispatch_drone\"}。\n28\t- GET /api/state：网页完整快照和事件，同时返回最近摄像头帧的元数据。\n29\t- POST /api/camera-frame：浏览器上传当前设备视角的 JPEG/PNG 帧。\n30\t- GET /api/camera-frame?cameraId=drone-cam-01：读取最近一帧原始图像。\n31\t\n32\t工具：attempt_self_recovery、stop_vehicle、dispatch_drone、return_drone、dispatch_rescue_vehicle、get_camera_frame。\n33\t\n34\t状态读取与工具结果都应返回给模型。HTTP 409 表示动作不满足条件，应把 error 返回给 AGH 重新决策。发布 decision 事件不执行动作，必须另调用工具。页面的人工按钮调用 /api/control，与 /api/tool 来源分开计数。\n35\t\n36\t气象数据单位：能见度 m、风速 m/s、温度 °C。位置是场景米制坐标，油量和电量为百分比。沙尘等级 1–6 是演示内部尺度。飞行和救援阈值是仿真规则，不用于真实作业。\n37\t\n38\t路线初始未知，只有无人机完成侦察后可获取。无人机在恶劣天气中自动返航；救援车在低能见度时保护停车。C 可将环境事件作为下一轮观察，决定等待或重新规划。\n39\t\n40\t## 交付与指标\n41\t\n42\t已实现：场景几何模型、沙丘道路、监测点、气象站、车辆、无人机、救援车、视角切换、沙尘动画、设备面板、真实来源日志、天气控制、工具执行和反馈。\n43\t\n44\t成功任务保存到 episodes.jsonl，包含耗时、人工动作、AGH 工具调用和失败调用次数。重置会清除本轮事件，不删除历史文件。记录仅是经验数据，尚未实现 RSI 或策略学习。未完成任务也会持续计时。\n45\t\n46\t当前限制：简化几何和运动，不是物理引擎；设备帧是浏览器 Three.js 仿真渲染而非真实摄像头；接口没有远程鉴权，因此仅开放本机。AGH 原生协议、经验检索和策略验证仍由 C 后续完成。\n47\t\n48\t## 图像观测回传\n49\t\n50\t页面会把无人机和救援车两个设备视角以 JPEG data URL 上传到服务端，默认每秒更新一次；页面仍可切换显示其中一个视角。AGH 或其他适配器可调用：\n51\t\n52\t```json\n53\tPOST /api/tool\n54\t{\"name\":\"get_camera_frame\",\"cameraId\":\"drone-cam-01\"}\n55\t```\n56\t\n57\t成功响应中的 `toolResult.data.imageData` 是可作为多模态图片输入的 `data:image/jpeg;base64,...`；同时提供 `cameraId`、`mimeType`、`timestamp`、`source` 和 `bytes`。救援车视角使用 `rescue-cam-01`。浏览器必须保持页面打开，服务端才会有最新帧。该图像来自 Three.js 仿真渲染，不是真实硬件摄像头；AGH 适配器仍需把 `imageData` 转换成其模型 API 所需的图片输入格式。\n58\t\n59\t## 模型、测试与日志\n60\t\n61\t- 模型信息、版本与调用方式见 `MODEL_NOTES.md`（Agnes 3.0 Flash，`agnes-3.0-flash`）。\n62\t- AGH 执行日志说明与三条测试对照见 `AGH_LOG_NOTES.md`。\n63\t- 三条测试（正常 / 边界 / 失败）可用以下任一脚本运行，结果追加到 `agh_execution_log.jsonl`：\n64\t  - `node agh_three_scenario_test.mjs`（自启服务）\n65\t  - `python test_agh.py`（需先启动服务，可用 `BASE_URL` 覆盖地址）\n66\t\n67\t## 代码验证说明\n68\t\n69\t生成时本机命令和 Node 执行工具发生初始化故障，尚未实际运行服务或完成浏览器验收。请按人工验收步骤检查；不要将此版本标为已测试或已接入 AGH。","resultSeq":1746,"enforcement":{"level":"partial","scope" <script>
(function () {
  'use strict';
  var dataEl = document.getElementById('agh-bundle');
  var bundle = JSON.parse(dataEl ? dataEl.textContent : 'null');

  function el(tag, text, cls) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function notIncluded(target) {
    target.appendChild(el('p', '未包含', 'agh-empty'));
  }
  function fmtDuration(ms) {
    if (ms === undefined || ms === null) return '进行中';
    if (ms < 1000) return ms + ' 毫秒';
    if (ms < 60000) return (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + ' 秒';
    return Math.floor(ms / 60000) + ' 分 ' + Math.round((ms % 60000) / 1000) + ' 秒';
  }

  var STATUS_LABEL = { running: '进行中', waiting: '等待中', completed: '已完成', failed: '失败', cancelled: '已取消' };
  var REASON_LABEL = { unavailable: '不可用', truncated: '已截断', limit: '超出上限', timeout: '超时', failed: '失败', imported: '导入' };
  var INCLUDE_LABEL = { conversation: '对话与轨迹', logs: '日志', system: '系统信息' };

  var tabButtons = Array.prototype.slice.call(document.querySelectorAll('#agh-tabs button'));
  var tabSections = Array.prototype.slice.call(document.querySelectorAll('main > section'));
  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var name = btn.getAttribute('data-tab');
      tabButtons.forEach(function (b) { b.setAttribute('aria-selected', b === btn ? 'true' : 'false'); });
      tabSections.forEach(function (section) { section.hidden = section.id !== 'tab-' + name; });
    });
  });

  function renderOverview() {
    var root = document.getElementById('tab-overview');
    var list = el('ul', undefined, 'agh-include');
    Object.keys(INCLUDE_LABEL).forEach(function (key) {
      var included = bundle.include && bundle.include[key];
      list.appendChild(el('li', INCLUDE_LABEL[key] + '：' + (included ? '已包含' : '未包含')));
    });
    root.appendChild(list);
    if (bundle.warnings && bundle.warnings.length > 0) {
      var warnings = el('ul', undefined, 'agh-warnings');
      bundle.warnings.forEach(function (warning) {
        var reason = REASON_LABEL[warning.reason] || warning.reason;
        var text = warning.source + '：' + reason + (warning.detail ? '（' + warning.detail + '）' : '');
        warnings.appendChild(el('li', text));
      });
      root.appendChild(warnings);
    }
    if (bundle.events) {
      var summary = '完整事件账本见 events.jsonl（' + bundle.events.count + ' 条，截至 seq ' + bundle.events.lastSeq + '）';
      root.appendChild(el('p', summary));
    }
  }

  function nodeText(node) {
    if (node.kind === 'user') return (node.content || []).map(function (b) { return (b && b.text) || ''; }).join(' ');
    if (node.kind === 'assistant') return node.text || node.thinking || '';
    if (node.kind === 'tool') return node.name + (node.summary ? '：' + node.summary : '');
    if (node.kind === 'approval') return node.summary || '';
    if (node.kind === 'compaction') return node.summary || '';
    if (node.kind === 'cost') return node.model || node.purpose || '';
    if (node.kind === 'artifact') return node.name || '';
    if (node.kind === 'context') return node.text || '';
    return '';
  }

  function renderConversation() {
    var root = document.getElementById('tab-conversation');
    var nodes = bundle.trace && bundle.trace.nodes;
    if (!nodes || nodes.length === 0) { notIncluded(root); return; }
    nodes.forEach(function (node) {
      var item = el('div', undefined, 'agh-node');
      item.appendChild(el('span', node.kind, 'agh-node-kind'));
      item.appendChild(el('span', nodeText(node)));
      item.appendChild(el('pre', JSON.stringify(node, null, 2)));
      root.appendChild(item);
    });
  }

  function renderSpan(span, depth, container) {
    var row = el('div', undefined, 'agh-span');
    row.style.paddingLeft = (depth * 16) + 'px';
    var parts = [span.kind, span.name, STATUS_LABEL[span.status] || span.status, fmtDuration(span.durationMs)];
    if (span.model) parts.push(span.model);
    if (span.error && span.error.message) parts.push('错误：' + span.error.message);
    row.textContent = parts.join(' · ');
    container.appendChild(row);
    (span.children || []).forEach(function (child) { renderSpan(child, depth + 1, container); });
  }

  function renderTrace() {
    var root = document.getElementById('tab-trace');
    var turns = (bundle.trace && bundle.trace.turns) || [];
    var withTrace = turns.filter(function (t) { return t.trace; });
    if (withTrace.length === 0) { notIncluded(root); return; }
    withTrace.forEach(function (turn) {
      root.appendChild(el('h3', '第 ' + turn.turn + ' 轮'));
      renderSpan(turn.trace, 0, root);
    });
  }

  function renderLogs() {
    var root = document.getElementById('tab-logs');
    if (!bundle.logs) { notIncluded(root); return; }
    ['daemon', 'host', 'browser'].forEach(function (key) {
      var value = bundle.logs[key];
      if (!value) return;
      root.appendChild(el('h3', key));
      if (key === 'browser') {
        var lines = (value.entries || []).map(function (entry) {
          return '[' + entry.ts + '] ' + entry.level + ' ' + entry.text;
        });
        root.appendChild(el('pre', lines.join('\n')));
      } else {
        root.appendChild(el('pre', value.text + (value.truncated ? '\n…（已截断）' : '')));
      }
    });
  }

  function renderSystem() {
    var root = document.getElementById('tab-system');
    if (!bundle.system) { notIncluded(root); return; }
    root.appendChild(el('pre', JSON.stringify(bundle.system, null, 2)));
  }

  function renderArtifacts() {
    var root = document.getElementById('tab-artifacts');
    if (!bundle.artifacts || bundle.artifacts.length === 0) { notIncluded(root); return; }
    var table = document.createElement('table');
    var head = document.createElement('tr');
    ['sha256', 'mime', 'lane', 'seq', 'source'].forEach(function (label) { head.appendChild(el('th', label)); });
    table.appendChild(head);
    bundle.artifacts.forEach(function (artifact) {
      var row = document.createElement('tr');
      row.appendChild(el('td', String(artifact.sha256).slice(0, 12)));
      row.appendChild(el('td', artifact.mime));
      row.appendChild(el('td', artifact.lane));
      row.appendChild(el('td', String(artifact.seq)));
      row.appendChild(el('td', artifact.source));
      table.appendChild(row);
    });
    root.appendChild(table);
  }

  renderOverview();
  renderConversation();
  renderTrace();
  renderLogs();
  renderSystem();
  renderArtifacts();
})();
</script>
